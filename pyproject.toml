[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "riskbeacon"
version = "0.1.0"
description = "Early-warning credit default scoring for consumer lending"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Ranjith Guggilla", email = "ranjithguggilla668@gmail.com" }]
keywords = ["credit-risk", "machine-learning", "catboost", "scoring", "lending"]
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "scikit-learn>=1.5",
    "catboost>=1.2",
    "imbalanced-learn>=0.12",
    "matplotlib>=3.8",
    "joblib>=1.3",
    "gradio>=4.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
riskbeacon-train = "riskbeacon.train_pipeline:run"
riskbeacon-app = "riskbeacon.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "C4"]
ignore = ["E402"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src"]
